<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | FACO</title>
  <meta property="og:site_name" content="FACO">
  <meta property="og:title" content="Contact | FACO">
  <meta property="og:url" content="https://facosim.com/contact">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://facosim.com/img/share-faco.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
  <main class="contact-page">
    <form action="https://formspree.io/f/mqkgvqno" method="POST">
      <h1>Contact FACO</h1>
      <div class="form-field">
        <label for="email">Your email</label>
        <input id="email" type="email" name="_replyto" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="message">Your message</label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>
      <div class="form-actions">
        <button type="submit">Send message</button>
        <a href="index.html">Return to homepage</a>
      </div>
    </form>
  </main>
</body>
</html>
